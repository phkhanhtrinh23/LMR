[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proxyattack"
version = "0.1.0"
description = "GPA (Gap-Targeted Proxy Attack) and LMR (Lift-Matched Reweighting) from 'When Genuine Purchases Become Poison'"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.1",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::FutureWarning"]
